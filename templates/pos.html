<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RektaPrint POS</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #222;
    --border: #2e2e2e;
    --text: #f0ebe0;
    --muted: #888;
    --accent: #e84f2b;
    --blue: #2b6be8;
    --green: #1faa5e;
    --yellow: #f5a623;
    --mono: 'DM Mono', monospace;
    --sans: 'Syne', sans-serif;
  }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.7rem 1.5rem; border-bottom: 1px solid var(--border);
    background: var(--surface); flex-wrap: wrap; gap: 0.5rem; flex-shrink: 0;
  }

  .logo { font-size: 1.1rem; font-weight: 800; letter-spacing: -0.03em; display: flex; align-items: center; gap: 0.4rem; }
  .logo-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; }
  .nav-links { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .nav-link {
    font-family: var(--mono); font-size: 0.68rem; padding: 0.35rem 0.75rem;
    border-radius: 6px; border: 1px solid var(--border); color: var(--muted);
    text-decoration: none; transition: all 0.15s;
  }
  .nav-link:hover, .nav-link.active { background: var(--text); color: var(--bg); border-color: var(--text); }

  /* ── Main Layout ── */
  .pos-layout {
    display: grid;
    grid-template-columns: 1fr 360px;
    flex: 1;
    overflow: hidden;
  }

  /* ── Left: Services Panel ── */
  .services-panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-right: 1px solid var(--border);
  }

  .pos-tabs {
    display: flex;
    gap: 0.5rem;
    padding: 0.8rem 0.8rem 0;
    flex-shrink: 0;
  }

  .pos-tab {
    font-family: var(--mono); font-size: 0.75rem; font-weight: 600;
    padding: 0.45rem 1rem; border-radius: 8px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); cursor: pointer; transition: all 0.15s;
  }
  .pos-tab.active, .pos-tab:hover { background: var(--accent); color: white; border-color: var(--accent); }

  .search-wrap { padding: 0.6rem 0.8rem; flex-shrink: 0; }

  .search-input {
    width: 100%; padding: 0.55rem 0.9rem;
    background: var(--surface2); border: 1.5px solid var(--border);
    border-radius: 8px; color: var(--text); font-family: var(--mono);
    font-size: 0.82rem; outline: none; transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--blue); }

  .service-groups { overflow-y: auto; flex: 1; padding-bottom: 1rem; }

  .category-section { margin-bottom: 0.3rem; }

  .category-header {
    font-family: var(--mono); font-size: 0.62rem; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
    padding: 0.6rem 0.9rem 0.3rem;
    display: flex; align-items: center; gap: 0.5rem;
    border-bottom: 1px solid var(--border); margin-bottom: 0.4rem;
  }

  .category-count {
    background: var(--surface2); color: var(--muted);
    font-size: 0.58rem; padding: 0.1rem 0.4rem; border-radius: 8px;
  }

  .service-grid-inner {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 0.5rem;
    padding: 0 0.7rem;
  }

  .service-card {
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 10px; padding: 0.85rem 0.75rem; cursor: pointer;
    transition: all 0.15s; position: relative;
  }
  .service-card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .service-card.promo {
    border-color: var(--green);
    background: linear-gradient(160deg, rgba(31,170,94,0.1), var(--surface));
  }
  .service-card.promo:hover { border-color: var(--green); }
  .service-card .name { font-weight: 700; font-size: 0.82rem; margin-bottom: 0.35rem; line-height: 1.3; }
  .service-card .price { font-family: var(--mono); font-size: 0.75rem; color: var(--accent); }
  .service-card.promo .price { color: var(--green); }
  .service-card .unit { font-family: var(--mono); font-size: 0.62rem; color: var(--muted); margin-top: 0.15rem; }

  .promo-ribbon {
    position: absolute; top: 0.4rem; right: 0.4rem;
    font-family: var(--mono); font-size: 0.52rem; font-weight: 700;
    color: white; background: var(--green); padding: 0.12rem 0.35rem;
    border-radius: 5px; letter-spacing: 0.04em;
  }

  .stock-tag { font-family: var(--mono); font-size: 0.58rem; color: var(--muted); margin-top: 0.2rem; }
  .stock-tag.low { color: #ff7070; }

  .no-results {
    text-align: center; padding: 2.5rem; color: var(--muted);
    font-family: var(--mono); font-size: 0.75rem;
  }

  /* ── Right: Cart Panel ── */
  .cart-panel {
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--surface);
  }

  .cart-header {
    padding: 1rem 1.2rem; border-bottom: 1px solid var(--border);
    background: var(--surface2); flex-shrink: 0;
  }
  .cart-header h2 { font-size: 0.95rem; font-weight: 800; }

  .cart-items { flex: 1; overflow-y: auto; padding: 0.6rem; }

  .cart-empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; color: var(--muted); text-align: center; gap: 0.5rem;
  }
  .cart-empty-icon { font-size: 2rem; opacity: 0.3; }
  .cart-empty p { font-family: var(--mono); font-size: 0.72rem; line-height: 1.6; }

  .cart-item {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.6rem 0.5rem; border-bottom: 1px solid var(--border);
  }
  .cart-item:last-child { border-bottom: none; }
  .item-name-col { flex: 1; font-size: 0.8rem; font-weight: 600; line-height: 1.3; }
  .item-price-col { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); }

  .qty-control { display: flex; align-items: center; gap: 0.3rem; flex-shrink: 0; }
  .qty-btn {
    width: 24px; height: 24px; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 5px;
    color: var(--text); font-size: 0.85rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .qty-btn:hover { background: var(--border); }
  .qty-input {
    width: 38px; text-align: center; font-family: var(--mono);
    font-size: 0.78rem; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 5px;
    color: var(--text); padding: 0.2rem;
  }
  .line-total { font-family: var(--mono); font-size: 0.75rem; font-weight: 700; color: var(--green); flex-shrink: 0; min-width: 55px; text-align: right; }
  .remove-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.85rem; padding: 0.2rem; }
  .remove-btn:hover { color: var(--accent); }

  /* ── Checkout ── */
  .checkout-section { padding: 0.8rem; border-top: 1px solid var(--border); flex-shrink: 0; }

  .checkout-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.3rem 0; font-size: 0.82rem;
  }
  .checkout-row .label { color: var(--muted); font-family: var(--mono); font-size: 0.72rem; }
  .checkout-row.total { font-size: 1.1rem; font-weight: 800; padding: 0.5rem 0; }

  .discount-input, .cash-input {
    width: 90px; text-align: right; padding: 0.3rem 0.5rem;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-family: var(--mono); font-size: 0.82rem;
  }

  .cash-input {
    width: 100%; margin-top: 0.5rem; padding: 0.6rem 0.8rem;
    font-size: 0.9rem; text-align: left;
  }

  .charge-btn {
    width: 100%; margin-top: 0.5rem; padding: 0.85rem;
    background: var(--accent); color: white; border: none; border-radius: 8px;
    font-family: var(--sans); font-weight: 800; font-size: 1rem; cursor: pointer;
    transition: opacity 0.15s;
  }
  .charge-btn:hover:not(:disabled) { opacity: 0.9; }
  .charge-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── Sale Complete Modal ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.75); z-index: 100;
    align-items: center; justify-content: center; backdrop-filter: blur(4px);
  }
  .modal-overlay.show { display: flex; }

  .modal-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 2rem 1.8rem; max-width: 320px; width: 90%; text-align: center;
  }
  .modal-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
  .modal-card h3 { font-size: 1.3rem; font-weight: 800; margin-bottom: 1rem; }
  .change-display { background: var(--surface2); border-radius: 10px; padding: 1rem; margin-bottom: 1.2rem; }
  .change-label { font-family: var(--mono); font-size: 0.65rem; color: var(--muted); letter-spacing: 0.1em; margin-bottom: 0.3rem; }
  .change-amount { font-size: 2rem; font-weight: 800; color: var(--green); }

  .receipt-btn {
    width: 100%; padding: 0.75rem; background: var(--surface2);
    color: var(--text); border: 1.5px solid var(--border);
    border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.88rem;
    margin-bottom: 0.6rem; transition: all 0.15s;
  }
  .receipt-btn:hover { background: var(--blue); color: white; border-color: var(--blue); }

  .new-sale-btn {
    width: 100%; padding: 0.75rem; background: var(--accent); color: white;
    border: none; border-radius: 8px; font-family: var(--sans);
    font-weight: 700; font-size: 0.88rem; cursor: pointer;
  }
  .new-sale-btn:hover { opacity: 0.9; }

  /* ── Toast ── */
  .toast {
    position: fixed; bottom: 1.5rem; right: 1.5rem;
    background: var(--surface2); border: 1px solid var(--border);
    border-left: 3px solid var(--green); border-radius: 8px;
    padding: 0.7rem 1rem; font-size: 0.82rem; font-weight: 600;
    z-index: 200; transform: translateX(120%);
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  .toast.show { transform: translateX(0); }

  @media (max-width: 768px) {
    .pos-layout { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="logo"><span class="logo-dot"></span>RektaPrint POS</div>
  <div class="nav-links">
    <a href="/admin" class="nav-link">Print Queue</a>
    <a href="/pos" class="nav-link active">POS</a>
    <a href="/dashboard" class="nav-link">Dashboard</a>
    <a href="/inventory" class="nav-link">Inventory</a>
    <a href="/expenses" class="nav-link">Expenses</a>
    <a href="/wastage" class="nav-link">Wastage</a>
    <a href="/settings" class="nav-link">Settings</a>
    <a href="/logout" class="nav-link">Logout</a>
  </div>
</header>

<div class="pos-layout">

  <!-- ── Services Panel ── -->
  <div class="services-panel">
    <div class="pos-tabs">
      <button class="pos-tab active" id="tabServices" onclick="switchTab('services')">Services</button>
      <button class="pos-tab" id="tabSupplies" onclick="switchTab('supplies')">School Supplies</button>
    </div>
    <div class="search-wrap" id="searchWrap">
      <input type="text" class="search-input" id="serviceSearch"
        placeholder="Search services..." oninput="filterServices(this.value)">
    </div>
    <div class="service-groups" id="serviceGrid"></div>
    <div class="service-groups" id="supplyGrid" style="display:none;"></div>
  </div>

  <!-- ── Cart Panel ── -->
  <div class="cart-panel">
    <div class="cart-header"><h2>Current Sale</h2></div>
    <div class="cart-items" id="cartItems">
      <div class="cart-empty">
        <div class="cart-empty-icon">🧾</div>
        <p>No items yet.<br>Tap a service to add it.</p>
      </div>
    </div>
    <div class="checkout-section">
      <div class="checkout-row">
        <span class="label">Subtotal</span>
        <span id="subtotalDisplay">₱0.00</span>
      </div>
      <div class="checkout-row">
        <span class="label">Discount</span>
        <input type="number" class="discount-input" id="discountInput" value="0" min="0" step="0.5" oninput="updateTotals()">
      </div>
      <div class="checkout-row total">
        <span>Total</span>
        <span id="totalDisplay">₱0.00</span>
      </div>
      <input type="number" class="cash-input" id="cashInput" placeholder="Cash received" min="0" step="0.5" oninput="updateTotals()">
      <button class="charge-btn" id="chargeBtn" disabled onclick="charge()">Charge</button>
    </div>
  </div>
</div>

<!-- Sale Complete Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card">
    <div class="modal-icon">✓</div>
    <h3>Sale Complete</h3>
    <div class="change-display">
      <div class="change-label">CHANGE</div>
      <div class="change-amount" id="changeAmount">₱0.00</div>
    </div>
    <button class="receipt-btn" onclick="printReceipt()">🖨️ Print Receipt</button>
    <button class="new-sale-btn" onclick="newSale()">New Sale</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  let services = [];
  let supplies = [];
  let cart = [];
  let lastSaleId = null;

  // ── Load services ──────────────────────────────────────────
  async function loadServices() {
    try {
      const resp = await fetch('/api/services');
      const data = await resp.json();
      if (!Array.isArray(data)) { console.error('Services error:', data); return; }
      services = data.map(s => ({ ...s, category: s.category || 'Other' }));
      services.sort((a, b) => (b.is_promo || 0) - (a.is_promo || 0));
      renderServiceGrid();
    } catch (e) {
      console.error('Failed to load services:', e);
    }
  }

  // ── Load supplies ──────────────────────────────────────────
  async function loadSupplies() {
    try {
      const resp = await fetch('/api/supplies');
      supplies = await resp.json();
      renderSupplyGrid();
    } catch (e) {
      console.error('Failed to load supplies:', e);
    }
  }

  // ── Tab switching ──────────────────────────────────────────
  function switchTab(tab) {
    const serviceGrid  = document.getElementById('serviceGrid');
    const supplyGrid   = document.getElementById('supplyGrid');
    const searchWrap   = document.getElementById('searchWrap');
    const tabServices  = document.getElementById('tabServices');
    const tabSupplies  = document.getElementById('tabSupplies');

    if (tab === 'services') {
      serviceGrid.style.display = '';
      supplyGrid.style.display  = 'none';
      searchWrap.style.display  = '';
      tabServices.classList.add('active');
      tabSupplies.classList.remove('active');
      document.getElementById('serviceSearch').value = '';
      renderServiceGrid();
    } else {
      serviceGrid.style.display = 'none';
      supplyGrid.style.display  = '';
      searchWrap.style.display  = 'none';
      tabServices.classList.remove('active');
      tabSupplies.classList.add('active');
      loadSupplies();
    }
  }

  // ── Render services grouped by category ───────────────────
  const CAT_ORDER = ['Piso Print', 'Printing', 'Photocopy', 'Scanning', 'Laminating', 'Other'];

  function renderServiceGrid(filtered) {
    const grid = document.getElementById('serviceGrid');
    const list = filtered !== undefined ? filtered : services;

    if (list.length === 0) {
      grid.innerHTML = '<div class="no-results">No services found</div>';
      return;
    }

    // Group by category
    const groups = {};
    list.forEach(function(s) {
      const cat = s.is_promo ? 'Piso Print' : (s.category || 'Other');
      if (!groups[cat]) groups[cat] = [];
      groups[cat].push(s);
    });

    const sortedCats = Object.keys(groups).sort(function(a, b) {
      const ai = CAT_ORDER.indexOf(a);
      const bi = CAT_ORDER.indexOf(b);
      if (ai === -1 && bi === -1) return a.localeCompare(b);
      if (ai === -1) return 1;
      if (bi === -1) return -1;
      return ai - bi;
    });

    let html = '';
    sortedCats.forEach(function(cat) {
      const items = groups[cat];
      html += '<div class="category-section">';
      html += '<div class="category-header">' + cat + ' <span class="category-count">' + items.length + '</span></div>';
      html += '<div class="service-grid-inner">';
      items.forEach(function(s) {
        const sIdx = services.indexOf(s);
        const promoRibbon = s.is_promo ? '<div class="promo-ribbon">PISO PRINT</div>' : '';
        html += '<div class="service-card' + (s.is_promo ? ' promo' : '') + '" onclick="addServiceToCart(' + sIdx + ')">';
        html += promoRibbon;
        html += '<div class="name">' + s.name + '</div>';
        html += '<div class="price">&#8369;' + s.price.toFixed(2) + '</div>';
        html += '<div class="unit">per ' + s.unit + '</div>';
        html += '</div>';
      });
      html += '</div></div>';
    });

    grid.innerHTML = html;
  }

  function filterServices(query) {
    if (!query.trim()) { renderServiceGrid(); return; }
    const q = query.toLowerCase();
    const filtered = services.filter(function(s) {
      return s.name.toLowerCase().includes(q)
          || (s.category || '').toLowerCase().includes(q)
          || s.price.toString().includes(q);
    });
    renderServiceGrid(filtered);
  }

  // ── Render supply grid ─────────────────────────────────────
  function renderSupplyGrid() {
    const grid = document.getElementById('supplyGrid');
    if (supplies.length === 0) {
      grid.innerHTML = '<div class="no-results">No school supplies set up. Add them in Inventory.</div>';
      return;
    }
    let html = '<div class="service-grid-inner" style="padding:0.7rem;">';
    supplies.forEach(function(s, i) {
      const outOfStock = s.remaining_stock <= 0;
      const isLow = s.remaining_stock <= s.low_stock_alert;
      html += '<div class="service-card" onclick="addSupplyToCart(' + i + ')"' + (outOfStock ? ' style="opacity:0.4;cursor:not-allowed;"' : '') + '>';
      html += '<div class="name">' + s.name + '</div>';
      html += '<div class="price">&#8369;' + s.selling_price.toFixed(2) + '</div>';
      html += '<div class="unit">per ' + s.unit + '</div>';
      html += '<div class="stock-tag' + (isLow ? ' low' : '') + '">' + s.remaining_stock + ' in stock</div>';
      html += '</div>';
    });
    html += '</div>';
    grid.innerHTML = html;
  }

  // ── Cart actions ───────────────────────────────────────────
  function addServiceToCart(idx) {
    const s = services[idx];
    const existing = cart.find(function(i) { return i.service_name === s.name && !i.inventory_item_id; });
    if (existing) {
      existing.quantity += 1;
    } else {
      cart.push({ service_name: s.name, unit_price: s.price, quantity: 1, unit: s.unit });
    }
    renderCart();
  }

  function addSupplyToCart(idx) {
    const s = supplies[idx];
    if (s.remaining_stock <= 0) { showToast('Out of stock'); return; }
    const existing = cart.find(function(i) { return i.inventory_item_id === s.id; });
    if (existing) {
      if (existing.quantity + 1 > s.remaining_stock) { showToast('Only ' + s.remaining_stock + ' left'); return; }
      existing.quantity += 1;
    } else {
      cart.push({ service_name: s.name, unit_price: s.selling_price, quantity: 1, unit: s.unit, inventory_item_id: s.id, max_stock: s.remaining_stock });
    }
    renderCart();
  }

  function updateQty(idx, delta) {
    const item = cart[idx];
    const newQty = Math.max(1, item.quantity + delta);
    if (item.max_stock !== undefined && newQty > item.max_stock) { showToast('Only ' + item.max_stock + ' left'); return; }
    item.quantity = newQty;
    renderCart();
  }

  function setQty(idx, val) {
    let qty = parseFloat(val) || 1;
    if (qty < 1) qty = 1;
    const item = cart[idx];
    if (item.max_stock !== undefined && qty > item.max_stock) qty = item.max_stock;
    item.quantity = qty;
    renderCart();
  }

  function removeItem(idx) {
    cart.splice(idx, 1);
    renderCart();
  }

  function renderCart() {
    const container = document.getElementById('cartItems');
    if (cart.length === 0) {
      container.innerHTML = '<div class="cart-empty"><div class="cart-empty-icon">🧾</div><p>No items yet.<br>Tap a service to add it.</p></div>';
      updateTotals();
      return;
    }

    let html = '';
    cart.forEach(function(item, i) {
      html += '<div class="cart-item">';
      html += '<div class="item-name-col">' + item.service_name + '<div class="item-price-col">&#8369;' + item.unit_price.toFixed(2) + '/' + item.unit + '</div></div>';
      html += '<div class="qty-control">';
      html += '<button class="qty-btn" onclick="updateQty(' + i + ', -1)">-</button>';
      html += '<input class="qty-input" type="number" value="' + item.quantity + '" min="1" onchange="setQty(' + i + ', this.value)">';
      html += '<button class="qty-btn" onclick="updateQty(' + i + ', 1)">+</button>';
      html += '</div>';
      html += '<div class="line-total">&#8369;' + (item.unit_price * item.quantity).toFixed(2) + '</div>';
      html += '<button class="remove-btn" onclick="removeItem(' + i + ')">&#x2715;</button>';
      html += '</div>';
    });
    container.innerHTML = html;
    updateTotals();
  }

  function updateTotals() {
    const subtotal  = cart.reduce(function(sum, i) { return sum + i.unit_price * i.quantity; }, 0);
    const discount  = parseFloat(document.getElementById('discountInput').value) || 0;
    const total     = Math.max(subtotal - discount, 0);
    const cash      = parseFloat(document.getElementById('cashInput').value) || 0;

    document.getElementById('subtotalDisplay').textContent = '\u20B1' + subtotal.toFixed(2);
    document.getElementById('totalDisplay').textContent    = '\u20B1' + total.toFixed(2);

    const chargeBtn = document.getElementById('chargeBtn');
    chargeBtn.disabled = cart.length === 0 || cash < total;
  }

  // ── Charge ─────────────────────────────────────────────────
  async function charge() {
    const discount = parseFloat(document.getElementById('discountInput').value) || 0;
    const cash     = parseFloat(document.getElementById('cashInput').value) || 0;
    const subtotal = cart.reduce(function(s, i) { return s + i.unit_price * i.quantity; }, 0);
    const total    = Math.max(subtotal - discount, 0);

    if (cash < total) { showToast('Not enough cash'); return; }

    const chargeBtn = document.getElementById('chargeBtn');
    chargeBtn.disabled   = true;
    chargeBtn.textContent = 'Processing...';

    try {
      const resp = await fetch('/api/pos/sale', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          items: cart.map(function(i) {
            return { service_name: i.service_name, unit_price: i.unit_price, quantity: i.quantity, inventory_item_id: i.inventory_item_id || null };
          }),
          discount: discount,
          cash_received: cash
        })
      });
      const data = await resp.json();

      if (data.error) {
        showToast('Error: ' + data.error);
        chargeBtn.disabled   = false;
        chargeBtn.textContent = 'Charge';
        return;
      }

      lastSaleId = data.sale_id;
      chargeBtn.textContent = 'Charge';
      document.getElementById('changeAmount').textContent = '\u20B1' + data.change.toFixed(2);
      document.getElementById('modalOverlay').classList.add('show');

    } catch (e) {
      showToast('Network error: ' + e.message);
      chargeBtn.disabled   = false;
      chargeBtn.textContent = 'Charge';
    }
  }

  function printReceipt() {
    if (lastSaleId) window.open('/receipt/' + lastSaleId, '_blank');
  }

  function newSale() {
    cart = [];
    lastSaleId = null;
    document.getElementById('discountInput').value = '0';
    document.getElementById('cashInput').value     = '';
    document.getElementById('modalOverlay').classList.remove('show');
    document.getElementById('chargeBtn').textContent = 'Charge';
    renderCart();
    loadSupplies();
  }

  // ── Toast ──────────────────────────────────────────────────
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 3000);
  }

  // ── Init ───────────────────────────────────────────────────
  loadServices();
  loadSupplies();
</script>
</body>
</html>
