<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrintQ – Admin Login</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Syne', sans-serif;
    background: #0f0f0f;
    color: #f0ebe0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .login-card {
    background: #1a1a1a;
    border: 1px solid #2e2e2e;
    border-radius: 16px;
    padding: 2.5rem;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 24px 48px rgba(0,0,0,0.5);
    position: relative;
    z-index: 1;
  }

  .logo {
    font-size: 1.8rem;
    font-weight: 800;
    letter-spacing: -0.04em;
    margin-bottom: 0.3rem;
  }

  .logo span {
    display: inline-block;
    width: 10px; height: 10px;
    background: #e84f2b;
    border-radius: 50%;
    margin-right: 0.3rem;
    vertical-align: middle;
  }

  .subtitle {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    color: #888;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 2rem;
  }

  .field { margin-bottom: 1.1rem; }

  label {
    display: block;
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    color: #888;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 0.4rem;
  }

  input {
    width: 100%;
    padding: 0.75rem 1rem;
    background: #0f0f0f;
    border: 1.5px solid #2e2e2e;
    border-radius: 8px;
    color: #f0ebe0;
    font-family: 'DM Mono', monospace;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus { border-color: #2b6be8; }

  .error {
    background: rgba(232,79,43,0.12);
    border: 1px solid rgba(232,79,43,0.3);
    border-radius: 8px;
    padding: 0.7rem 1rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    color: #ff7070;
    margin-bottom: 1.2rem;
  }

  .login-btn {
    width: 100%;
    padding: 0.85rem;
    background: #e84f2b;
    color: white;
    border: none;
    border-radius: 8px;
    font-family: 'Syne', sans-serif;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
    margin-top: 0.5rem;
    transition: opacity 0.2s;
    letter-spacing: -0.01em;
  }

  .login-btn:hover { opacity: 0.88; }
</style>
</head>
<body>
<div class="login-card">
  <div class="logo"><span></span>PrintQ</div>
  <div class="subtitle">Admin Access Only</div>

  {% if error %}
  <div class="error">⚠️ {{ error }}</div>
  {% endif %}

  <form method="POST">
    <div class="field">
      <label>Username</label>
      <input type="text" name="username" placeholder="admin" required autofocus>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••" required>
    </div>
    <button type="submit" class="login-btn">Login →</button>
  </form>
</div>
</body>
</html>
